# Local dev infrastructure. Runs Postgres 16 with the pgvector extension.
# The API (uvicorn) and frontend (next dev) are run on the host, not here.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: notebooklm_rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Enables the pgvector extension on first startup.
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
